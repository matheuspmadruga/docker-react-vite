name: Deploy frontend
on:
  push:
    branches:
      - main #Keep looking for the push that is executed to the branch main

jobs:
  build:
    runs-on: ubuntu-latest #aka suno:required on Travis CI
    steps:
      - uses: actions/checkout@v3
     # - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t matheuspmadruga/docker-react-vite -f Dockerfile.dev .
      - run: docker run -e CI=true matheuspmadruga/docker-react-vite npm test

     # - name: Generate deployment package
     #   run: zip -r deploy.zip . -x '*.git*'
     # - name: Deploy to ElasticBeanstalk
     #   uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: frontend
          environment_name: Frontend-env
          existing_bucket_name: elasticbeanstalk-sa-east-1-117211782824
          region: sa-east-1
     #     version_label: ${{ github.sha }}
     #     deployment_package: deploy.zip
